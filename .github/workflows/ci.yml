name: Whisper Local v3 checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stub-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "python-multipart>=0.0.20,<1" "httpx>=0.27,<1" "opencc==1.4.2" "numpy>=1.24"
      - name: Python syntax and tests (no model download)
        run: |
          python -m compileall -q app scripts tests
          python -m unittest discover -s tests -t . -v
      - name: JavaScript audio gate and browser syntax
        run: |
          node --check web/ui.js
          node --check web/sound-gate.js
          node tests/test_sound_gate.mjs
      - name: Deployment scripts syntax
        run: bash -n scripts/*.sh
