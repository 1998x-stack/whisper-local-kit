name: Whisper Local tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight API test dependencies
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'python-multipart>=0.0.20,<1' httpx
      - name: Python mocked Whisper/API tests (no model download)
        run: python -m unittest discover -s tests -v
      - name: JavaScript audio gate tests
        run: node --test tests/test_sound_gate.mjs
      - name: Validate deployment shell scripts
        run: bash -n scripts/*.sh
