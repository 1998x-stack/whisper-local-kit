name: checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stub-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "python-multipart>=0.0.20,<1" "httpx>=0.27,<1"
      - name: Python syntax and tests (no model download)
        run: |
          python -m compileall -q app scripts tests
          python -m unittest discover -s tests -t . -v
      - name: Browser JavaScript
        run: |
          node --check web/ui.js
          node --check web/sound-gate.js
          node tests/test_sound_gate.mjs
